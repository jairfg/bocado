name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    # Redis para las pruebas de integración de la cola (BullMQ)
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # La API y el lint type-aware importan @bocado/shared desde dist/
      - run: npm run build:shared

      # El cliente de Prisma no se versiona: se genera desde schema.prisma
      - name: Generate Prisma client
        run: npm run db:generate -w api

      - run: npm run lint

      - run: npm test

      # Cola, worker y SSE con Redis real y el modelo simulado; sin API keys
      - name: Integration tests
        run: npm run test:integration -w api
        env:
          REDIS_URL: redis://localhost:6379/1

      - name: Build API
        run: npm run build -w api

      - name: Build web
        run: npm run build -w web
