services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: bocado
      POSTGRES_PASSWORD: bocado
      POSTGRES_DB: bocado
    ports:
      # 5432, 5433 y 5434 ya están en uso en esta máquina
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bocado -d bocado"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      # 6379 ya está en uso en esta máquina
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
